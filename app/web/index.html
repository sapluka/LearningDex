<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Dex</title>
  <link rel="stylesheet" href="dist/katex.min.css">
  <script src="dist/marked.umd.js"></script>
  <script src="dist/purify.min.js"></script>
  <script src="dist/katex.min.js"></script>
  <script src="dist/auto-render.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body spellcheck="false">
  <div class="app">
    <!-- 左栏：设置与导航 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">LD</div>
        <span class="brand-name">Learning Dex</span>
      </div>

      <nav class="menu">
        <button class="menu-item" id="newParseBtn">
          <img class="icon" src="icons/plus-24.svg" alt="" aria-hidden="true"><span>新解析</span>
        </button>
        <button class="menu-item" id="taskBtn">
          <img class="icon" src="icons/file-24.svg" alt="" aria-hidden="true"><span>任务管理</span>
        </button>
        <button class="menu-item" id="favBtn">
          <img class="icon" src="icons/star-24.svg" alt="" aria-hidden="true"><span>我的收藏</span>
        </button>
      </nav>

      <div class="quick">
        <div class="quick-label">快速设置</div>
        <div class="quick-box" id="quickBox">
          <label>转写模型</label>
          <select id="whisperModel">
            <option value="base">base（CPU）</option>
            <option value="small">small</option>
            <option value="large-v3-turbo">turbo（GPU）</option>
          </select>
          <label class="chk"><input type="checkbox" id="proofread"> LLM 核验</label>
        </div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="skillBtn">＋skill</button>
        <button class="btn primary" id="startBtn">开始解析</button>
      </div>

      <div class="foot">
        <button class="foot-ico" id="githubBtn" title="GitHub 项目入口" aria-label="GitHub 项目入口"><img class="icon" src="icons/mark-github-16.svg" alt="" aria-hidden="true"></button>
        <button class="foot-ico" id="settingsBtn" title="设置" aria-label="设置"><img class="icon" src="icons/gear-24.svg" alt="" aria-hidden="true"></button>
      </div>
    </aside>

    <!-- 中间栏：编辑器区 -->
    <main class="center">
      <!-- 初始态 -->
      <section id="welcome" class="welcome">
        <h1 class="h1">视频学习助手</h1>
        <p class="slogan">快速总结并讲解视频内容</p>
        <input id="url" class="url-input" placeholder="输入视频链接" />
        <div id="welcomeError" class="welcome-error" hidden></div>
        <div class="sample-entry"><img class="icon" src="icons/book-24.svg" alt="" aria-hidden="true"><span>示例</span></div>
        <div class="sample-cards" id="sampleCards"></div>
      </section>

      <!-- 工作态 -->
      <section id="workspace" class="workspace" hidden>
        <div class="doc-head">
          <button type="button" class="doc-title" id="docTitle" title="修改任务标题" disabled>学习文档</button>
          <input id="titleInput" class="doc-title-edit" type="text" maxlength="50" aria-label="任务标题" hidden>
          <button class="star" id="favDocBtn" title="收藏" aria-label="收藏" aria-pressed="false"><img class="icon" src="icons/star-24.svg" alt="" aria-hidden="true"></button>
        </div>
        <div id="state" class="state"></div>
        <div id="meta" class="meta"></div>
        <div class="editor-shell">
          <div id="editor" class="editor"></div>
          <div id="processingMessage" class="processing-message" hidden></div>
        </div>
        <div class="end-bar">
          <button class="btn ghost" id="exportMdBtn">导出 .md</button>
          <button class="btn primary" id="pdfBtn">生成PDF</button>
        </div>
      </section>

      <div id="formatMenu" class="format-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-wrap="**">加粗</button>
        <button type="button" role="menuitem" data-wrap="*">斜体</button>
        <button type="button" role="menuitem" data-wrap="==">高亮</button>
        <button type="button" role="menuitem" data-wrap="~~">删除线</button>
      </div>
      <div id="mmdLayer" class="mmd-layer"></div>
      <div id="mathLayer" class="math-layer"></div>
    </main>

    <div id="panelDivider" class="panel-divider" role="separator" aria-orientation="vertical" aria-label="调整编辑区和对话区宽度" tabindex="0"></div>

    <!-- 右栏：对话区 -->
    <section class="chat">
      <div class="chat-head">
        <span class="chat-title">对话</span>
      </div>
      <div id="chatLog" class="chat-log" style="display:flex;align-items:center;justify-content:center;">
        <span class="chat-empty">今天想要学些什么</span>
      </div>
      <div class="chat-tips">Tips：尝试和 LLM 对话！</div>
      <div class="chat-input-row">
        <input id="chatInput" class="chat-input" placeholder="输入问题…" />
        <button class="chat-send" id="chatSendBtn" title="发送" aria-label="发送"><img class="icon" src="icons/arrow-up-24.svg" alt="" aria-hidden="true"></button>
      </div>
    </section>
  </div>

  <!-- 设置弹层 -->
  <div id="settings" class="modal" hidden>
    <div class="modal-box">
      <h2>设置</h2>
      <div class="row">
        <label>协议</label>
        <select id="protocol">
          <option value="openai">OpenAI 兼容</option>
          <option value="anthropic">Anthropic</option>
          <option value="deepseek">DeepSeek</option>
          <option value="custom">自定义</option>
        </select>
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="sk-...">
      </div>
      <div class="row">
        <label>请求 URL</label>
        <input id="baseUrl" placeholder="https://api.example.com/v1（可选）">
        <label>模型</label>
        <input id="model" placeholder="gpt-4o / claude-3-5...">
      </div>
      <div class="row">
        <label>B站 SESSDATA</label>
        <input id="sessdata" type="password" placeholder="可选">
        <label>cookies.txt</label>
        <input id="cookiesFile" placeholder="路径（可选）">
      </div>
      <div class="row">
        <label>存储目录</label>
        <input id="outputDir" placeholder="默认软件目录下 output（可自定义）">
      </div>
      <div class="row">
        <label>PDF 输出目录</label>
        <input id="pdfOutputDir" placeholder="默认同笔记存储目录">
        <button id="choosePdfDir" type="button">选择</button>
      </div>
      <div class="row">
        <button id="testBtn">检验连接</button>
        <button id="saveBtn">保存</button>
        <span id="setMsg" class="msg"></span>
      </div>
      <div class="row right"><button class="btn primary" id="closeSettings">关闭</button></div>
    </div>
  </div>

  <!-- Skills 管理弹层 -->
  <div id="skillsModal" class="modal" hidden>
    <div class="modal-box">
      <h2>Skills 管理</h2>
      <div class="row">
        <select id="skillSelect"></select>
        <button id="skillNew">新建</button>
        <button id="skillDelete">删除</button>
      </div>
      <div class="row">
        <label>名称</label>
        <input id="skillName" placeholder="如 讲解">
      </div>
      <textarea id="skillContent" rows="10" placeholder="技能提示词内容…"></textarea>
      <div class="row right">
        <span id="skillMsg" class="msg"></span>
        <button class="btn primary" id="skillSave">保存</button>
        <button class="btn" id="skillClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 任务管理弹层 -->
  <div id="tasksModal" class="modal" hidden>
    <div class="modal-box">
      <h2>任务管理</h2>
      <div id="taskList" class="task-list"></div>
      <div class="row right"><button class="btn primary" id="tasksClose">关闭</button></div>
    </div>
  </div>

  <!-- 我的收藏弹层 -->
  <div id="favsModal" class="modal" hidden>
    <div class="modal-box">
      <h2>我的收藏</h2>
      <div id="favList" class="task-list"></div>
      <div class="row right"><button class="btn primary" id="favsClose">关闭</button></div>
    </div>
  </div>

  <div id="printRoot" class="print-root"></div>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
