<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Dex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 左栏：设置与导航 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">LD</div>
        <span class="brand-name">Learning Dex</span>
      </div>

      <nav class="menu">
        <button class="menu-item" id="newParseBtn">
          <span class="ico">＋</span><span>新解析</span>
        </button>
        <button class="menu-item" id="taskBtn">
          <span class="ico">▤</span><span>任务管理</span>
        </button>
        <button class="menu-item" id="favBtn">
          <span class="ico">★</span><span>我的收藏</span>
        </button>
      </nav>

      <div class="quick">
        <div class="quick-label">快速设置</div>
        <div class="quick-box" id="quickBox">
          <label>转写模型</label>
          <select id="whisperModel">
            <option value="base">base（CPU）</option>
            <option value="small">small</option>
            <option value="large-v3-turbo">turbo（GPU）</option>
          </select>
          <label class="chk"><input type="checkbox" id="proofread"> LLM 核验</label>
        </div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="skillBtn">＋skill</button>
        <button class="btn primary" id="startBtn">开始解析</button>
      </div>

      <div class="foot">
        <button class="foot-ico" id="githubBtn" title="GitHub 项目入口">🐱</button>
        <button class="foot-ico" id="settingsBtn" title="设置">⚙</button>
      </div>
    </aside>

    <!-- 中间栏：编辑器区 -->
    <main class="center">
      <!-- 初始态 -->
      <section id="welcome" class="welcome">
        <h1 class="h1">视频学习助手</h1>
        <p class="slogan">快速总结并讲解视频内容</p>
        <input id="url" class="url-input" placeholder="输入视频链接" />
        <div class="sample-entry">▣ 示例</div>
        <div class="sample-cards">
          <div class="sample-card">示例预览 1</div>
          <div class="sample-card">示例预览 2</div>
        </div>
      </section>

      <!-- 工作态 -->
      <section id="workspace" class="workspace" hidden>
        <div class="doc-head">
          <div class="doc-title" id="docTitle">学习文档</div>
          <button class="star" id="favDocBtn" title="收藏">☆</button>
        </div>
        <div id="state" class="state"></div>
        <div id="meta" class="meta"></div>
        <div class="toolbar">
          <button class="tb" data-wrap="**" title="加粗">B</button>
          <button class="tb" data-wrap="*" title="斜体">I</button>
          <button class="tb" data-wrap="==" title="高亮">H</button>
          <button class="tb" data-wrap="~~" title="删除线">S</button>
        </div>
        <div id="editor" class="editor"></div>
        <div id="notes" class="notes" hidden>
          <div class="notes-title">批注</div>
          <div id="notesList" class="notes-list"></div>
        </div>
        <div class="end-bar">
          <button class="btn primary" id="endStudyBtn">结束学习</button>
        </div>
      </section>

      <!-- 右上角弹层：查词 / 选区操作 -->
      <div id="selectPop" class="select-pop" hidden></div>
      <div id="termPop" class="term-pop" hidden></div>
      <div id="hlLayer" class="hl-layer"></div>
      <div id="termLayer" class="term-layer"></div>
    </main>

    <!-- 右栏：对话区 -->
    <section class="chat">
      <div class="chat-head">
        <button class="chat-ico" id="historyBtn" title="历史对话">🕘</button>
        <span class="chat-title">对话</span>
      </div>
      <div id="pending" class="pending" hidden>
        <div class="pending-title">待查名词</div>
        <div id="pendingList" class="pending-list"></div>
      </div>
      <div id="chatLog" class="chat-log" style="display:flex;align-items:center;justify-content:center;">
        <span class="chat-empty">今天想要学些什么</span>
      </div>
      <div class="chat-tips">Tips：尝试和 LLM 对话！</div>
      <div class="chat-input-row">
        <input id="chatInput" class="chat-input" placeholder="输入问题…" />
        <button class="chat-send" id="chatSendBtn">↵</button>
      </div>
    </section>
  </div>

  <!-- 设置弹层 -->
  <div id="settings" class="modal" hidden>
    <div class="modal-box">
      <h2>设置</h2>
      <div class="row">
        <label>协议</label>
        <select id="protocol">
          <option value="openai">OpenAI 兼容</option>
          <option value="anthropic">Anthropic</option>
          <option value="deepseek">DeepSeek</option>
          <option value="custom">自定义</option>
        </select>
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="sk-...">
      </div>
      <div class="row">
        <label>请求 URL</label>
        <input id="baseUrl" placeholder="https://api.example.com/v1（可选）">
        <label>模型</label>
        <input id="model" placeholder="gpt-4o / claude-3-5...">
      </div>
      <div class="row">
        <label>B站 SESSDATA</label>
        <input id="sessdata" type="password" placeholder="可选">
        <label>cookies.txt</label>
        <input id="cookiesFile" placeholder="路径（可选）">
      </div>
      <div class="row">
        <label>存储目录</label>
        <input id="outputDir" placeholder="默认软件目录下 output（可自定义）">
      </div>
      <div class="row">
        <button id="testBtn">检验连接</button>
        <button id="saveBtn">保存</button>
        <span id="setMsg" class="msg"></span>
      </div>
      <div class="row right"><button class="btn primary" id="closeSettings">关闭</button></div>
    </div>
  </div>

  <!-- Skills 管理弹层 -->
  <div id="skillsModal" class="modal" hidden>
    <div class="modal-box">
      <h2>Skills 管理</h2>
      <div class="row">
        <select id="skillSelect"></select>
        <button id="skillNew">新建</button>
        <button id="skillDelete">删除</button>
      </div>
      <div class="row">
        <label>名称</label>
        <input id="skillName" placeholder="如 讲解">
      </div>
      <textarea id="skillContent" rows="10" placeholder="技能提示词内容…"></textarea>
      <div class="row right">
        <span id="skillMsg" class="msg"></span>
        <button class="btn primary" id="skillSave">保存</button>
        <button class="btn" id="skillClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 任务管理弹层 -->
  <div id="tasksModal" class="modal" hidden>
    <div class="modal-box">
      <h2>任务管理</h2>
      <div id="taskList" class="task-list"></div>
      <div class="row right"><button class="btn primary" id="tasksClose">关闭</button></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
